<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Aloud Reader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <span class="wave bar-1"></span>
          <span class="wave bar-2"></span>
          <span class="wave bar-3"></span>
        </div>
        <div>
          <h1 class="app-title">Simple Aloud</h1>
          <p class="app-subtitle">Natural Voice Reader</p>
        </div>
      </div>
      <div id="status-badge" class="badge badge-idle">Ready</div>
    </header>

    <main class="main-content">
      <div class="article-info">
        <p id="article-title" class="article-title">Click Read Aloud to begin</p>
      </div>

      <div class="primary-controls">
        <button id="btn-play-pause" class="btn btn-primary" title="Start or Pause Reading">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M8 5v14l11-7z" id="icon-play-path" />
          </svg>
          <span id="btn-play-label">Read Aloud</span>
        </button>

        <button id="btn-stop" class="btn btn-secondary" title="Stop Reading" disabled>
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
      </div>

      <div class="setting-group">
        <label for="voice-select" class="setting-label">Voice & Accent</label>
        <select id="voice-select" class="select-dropdown">
          <optgroup label="United States">
            <option value="en-US-female">US - Sarah (Female)</option>
            <option value="en-US-male">US - Guy (Male)</option>
          </optgroup>
          <optgroup label="United Kingdom">
            <option value="en-GB-female">UK - Sonia (Female)</option>
            <option value="en-GB-male">UK - Ryan (Male)</option>
          </optgroup>
          <optgroup label="India">
            <option value="en-IN-female">India - Neerja (Female)</option>
            <option value="en-IN-male">India - Prabhat (Male)</option>
          </optgroup>
        </select>
      </div>

      <div class="setting-group">
        <div class="setting-header">
          <label for="speed-slider" class="setting-label">Reading Speed</label>
          <span id="speed-display" class="speed-value">1.0x</span>
        </div>
        <input type="range" id="speed-slider" min="0.75" max="2.0" step="0.25" value="1.0" class="slider" />
        <div class="speed-ticks">
          <span>0.75x</span>
          <span>1.0x</span>
          <span>1.5x</span>
          <span>2.0x</span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span class="hint">Shortcut: <kbd>Alt+Shift+R</kbd></span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
